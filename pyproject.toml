[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mysmallutils"
version = "2.1.9"
authors = [
  { name="José Manuel Gómez Soriano", email="jmgomez.soriano@gmail.com" },
]
description = "Small Python utils to do life easier."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.7, <4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/jmgomezsoriano/mysmallutils"

[tool.setuptools.packages.find]
where = ["."]
include = ["mysutils", "mysutils.*"]
exclude = ["tests", "tests.*", "venv", ".git"]

[project.optional-dependencies]
# Defines the [cron] extra and its dependencies
cron = [
    "croniter>=2.0.0,<3"
]
yaml = [
    "tqdm>=4.61.0,<7"
]
requests = [
    "requests>=2.25.1,<3"
]
tqdm = [
    "tqdm>=4.61.0,<5"
]